[package]
name = "xmip-core-transport-aws-s3"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-aws-s3"
description = "Amazon S3 transport: Signature Version 4 over the REST API — list a prefix, get and delete each object, put a Stream as an object — a bucket prefix is a Location. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# XML character data, escaped as every reader in the estate unescapes it.
codec = { workspace = true, optional = true }
# The endpoint parser, the request and its answer, and TLS behind the
# `tls` feature — one TLS stack in the estate, the http technology's
# (ADR-0033).
http = { workspace = true, optional = true }
# Percent-encoding (RFC 3986), written once for the estate, HTTP/1.1 on the
# wire (`net::http`) and the URL an endpoint is (`net::Endpoint`).
net = { workspace = true, optional = true }
# Signature Version 4, which this crate carried with its SHA-256 and HMAC
# until 2026-09-14; it is AWS's, and every AWS technology signs through the
# AWS crate (ADR-0044, the owner's ruling of 2026-09-22). Its declaration
# alone where this crate is (`access_key::ACCESS_KEY_ID`).
aws = { workspace = true, default-features = false }

[dev-dependencies]
# A Location's secret held in memory for the tests, from the capability's
# test support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "aws/default", "dep:codec", "dep:http", "dep:net"]
# The declaration alone, the AWS crate's `access_key_id` among its settings.
declaration = ["aws/declaration"]
# HTTPS endpoints: the http technology's `tls`, off by default as there.
tls = ["default", "http/tls"]

[lints]
workspace = true
